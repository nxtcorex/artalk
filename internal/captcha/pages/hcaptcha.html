<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hCaptcha</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        background: transparent;
        color-scheme: {{if eq .theme "dark"}}dark{{else}}light{{end}};
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <script src="https://js.hcaptcha.com/1/api.js?onload=loadHCaptcha" async defer></script>
    <script>
      const loadHCaptcha = () => {
        hcaptcha.render('container', {
          sitekey: '{{.site_key}}',
          theme: '{{.theme}}',
          callback: function (token) {
            fetch('./verify', {
              method: 'POST',
              headers: {
                Accept: 'application/json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ value: token }),
            })
              .then(function (res) {
                if (!res.ok) {
                  res.json().then((json) => {
                    alert('验证失败：' + res.status + ' ' + json.msg || '')
                  })
                }
              })
              .catch(function (err) {
                console.error(err)
                alert('后端 API 请求失败：' + err)
              })
          },
        })
      }
    </script>
    <script>
      ;(function () {
        function report() {
          var h = Math.ceil(
            document.body.getBoundingClientRect().height || document.body.scrollHeight
          )
          if (window.__artalkCaptchaH === h) return
          window.__artalkCaptchaH = h
          window.parent.postMessage({ type: 'artalk:captcha-height', height: h }, '*')
        }
        window.addEventListener('load', report)
        if (window.ResizeObserver) new ResizeObserver(report).observe(document.body)
      })()
    </script>
  </body>
</html>
