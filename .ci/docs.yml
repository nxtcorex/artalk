.ci-docs-site: &ci-docs-site
  name: Build documentation site
  docker:
    image: node:26.12.1
    volumes:
      - node_modules
      - pnpm-store:/root/.local/share/pnpm/store:rw
  ifModify:
    - "docs/**"
  env:
    CI: "true"
  stages:
    - name: Build site
      script: |
        set -eu
        npm install -g pnpm@12.15.0
        pnpm install --frozen-lockfile
        pnpm build:docs
        tar -czf "docs-site-$CNB_COMMIT_SHORT.tar.gz" \
          -C docs/docs/.vitepress/dist .
    - name: Upload site archive
      image: cnbcool/attachments:latest
      settings:
        attachments:
          - docs-site-$CNB_COMMIT_SHORT.tar.gz

master:
  push:
    docs-site: *ci-docs-site
