.ci-docs-site: &ci-docs-site
  name: Build documentation site
  docker:
    image: node:24
    volumes:
      - node_modules
      - pnpm-store:/root/.local/share/pnpm/store:rw
  ifModify:
    - "docs/**"
    - "ui/**"
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - "scripts/**"
    - "*.json"
    - "*.js"
    - "*.mjs"
    - "*.ts"
    - Makefile
    - .cnb.yml
    - .ci/checks.yml
    - .ci/docs.yml
  env:
    CI: "true"
  stages:
    - name: Build site
      script: |
        set -eu
        npm install -g pnpm@11.13.1
        pnpm install --frozen-lockfile
        pnpm build:docs
        tar -czf "docs-site-$CNB_COMMIT_SHORT.tar.gz" \
          -C docs/docs/.vitepress/dist .
    - name: Upload site archive
      image: cnbcool/attachments:latest
      settings:
        attachments:
          - docs-site-$CNB_COMMIT_SHORT.tar.gz

master:
  push:
    docs-site: *ci-docs-site
