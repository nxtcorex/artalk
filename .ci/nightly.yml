.ci-nightly: &ci-nightly
  name: Build nightly
  runner:
    cpus: 8
  docker:
    image: cnbcool/default-build-env:latest
    volumes:
      - node_modules
      - pnpm-store:/root/.local/share/pnpm/store:rw
  services:
    - docker
  env:
    ARTALK_NIGHTLY_WRITES: "true"
    ARTALK_IMAGE: docker.cnb.cool/pw.sh.cn/artalk
    PNPM_VERSION: 12.15.0
    TZ: Asia/Shanghai
  lock:
    key: nightly
    wait: true
    cancel-in-wait: true
  stages:
    - name: Check for recent commits
      script: .ci/scripts/check-nightly.sh
    - name: Build UI
      image: node:26.12.1
      script: |
        set -eu
        npm install -g "pnpm@$PNPM_VERSION"
        make build-frontend
        make pack-frontend
    - name: Build nightly artifacts
      script: .ci/scripts/build-nightly.sh
    - name: Build nightly-distroless image
      script: .ci/scripts/build-nightly-distroless.sh
    - name: Build nightly bundle image
      script: .ci/scripts/build-nightly-bundle.sh
    - name: Update nightly tag
      if: '[ "${DRY_RUN:-true}" = "false" ] && [ "$ARTALK_NIGHTLY_WRITES" = "true" ]'
      script: .ci/scripts/update-nightly-tag.sh
    - name: Create nightly Release
      if: '[ "${DRY_RUN:-true}" = "false" ] && [ "$ARTALK_NIGHTLY_WRITES" = "true" ]'
      type: git:release
      options:
        tag: nightly
        title: Artalk Nightly
        descriptionFromFile: nightly-dist/release-notes.md
        overlying: true
        preRelease: true
        latest: false
    - name: Upload nightly files
      if: '[ "${DRY_RUN:-true}" = "false" ] && [ "$ARTALK_NIGHTLY_WRITES" = "true" ]'
      image: cnbcool/attachments:latest
      settings:
        tag: nightly
        attachments:
          - "nightly-dist/*.tar.gz"
          - nightly-dist/checksums.txt

$:
  web_trigger_nightly:
    nightly: *ci-nightly
