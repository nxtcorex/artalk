.ci-go-check: &ci-go-check
  name: Go checks
  docker:
    image: golang:1.26.5
    volumes:
      - go-mod:/go/pkg/mod:cow
      - go-build:/root/.cache/go-build:cow
  ifModify:
    - "**/*.go"
    - go.mod
    - go.sum
    - Makefile
    - .cnb.yml
    - .ci/checks.yml
  env:
    REPORT_DIR: .ci-reports/go
  stages:
    - name: Vet and test
      script: |
        go mod download
        go vet ./...

.ci-frontend-check: &ci-frontend-check
  name: Frontend checks
  docker:
    image: node:24
    volumes:
      - node_modules
      - pnpm-store:/root/.local/share/pnpm/store:rw
  ifModify:
    - "ui/**"
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - "scripts/**"
    - "*.json"
    - "*.js"
    - "*.mjs"
    - "*.ts"
    - Makefile
    - .cnb.yml
    - .ci/checks.yml
  env:
    CI: "true"
  stages:
    - name: Install dependencies
      script: |
        npm install -g pnpm@11.22.0
        pnpm install --frozen-lockfile
    - name: Build and test
      script: |
        pnpm build:all
        pnpm test
        pnpm build:plugins
        pnpm -F artalk test:attw || true
    - name: Lint
      script: pnpm eslint ui && pnpm prettier --check ui

.ci-docs-check: &ci-docs-check
  name: Documentation checks
  docker:
    image: node:24
    volumes:
      - node_modules
      - pnpm-store:/root/.local/share/pnpm/store:rw
  ifModify:
    - "docs/**"
    - "ui/**"
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - "scripts/**"
    - "*.json"
    - "*.js"
    - "*.mjs"
    - "*.ts"
    - Makefile
    - .cnb.yml
    - .ci/checks.yml
    - .ci/docs.yml
  env:
    CI: "true"
  stages:
    - name: Install dependencies
      script: |
        npm install -g pnpm@11.22.0
        pnpm install --frozen-lockfile
    - name: Build documentation
      script: pnpm build:docs
    - name: Lint documentation
      script: pnpm eslint docs && pnpm prettier --check docs

"**":
  push:
    go: *ci-go-check
    frontend: *ci-frontend-check
    docs: *ci-docs-check
  pull_request:
    go: *ci-go-check
    frontend: *ci-frontend-check
    docs: *ci-docs-check
