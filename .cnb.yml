include:
  - .ci/checks.yml
  - .ci/docs.yml
  - .ci/release.yml
  - .ci/nightly.yml

$:
  vscode:
    - docker:
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: mise
          script: |
            export MISE_INSTALL_FROM_GITHUB=1
            curl https://mise.run | sh
            echo "eval \"\$(/root/.local/bin/mise activate bash)\"" >> "/root/.bashrc"
            echo "eval \"\$(/root/.local/bin/mise activate zsh)\"" >> "/root/.zshrc"
        - name: mise install
          script: |
            apt-get update || true
            apt-get install libatomic1 make gcc -y || true
            eval "$(/root/.local/bin/mise activate bash)"
            mise install
            npm install -g pnpm@11.22.0
        - name: pnpm install
          script: |
            eval "$(/root/.local/bin/mise activate bash)"
            pnpm install --frozen-lockfile
        - name: prepare
          script: |
            eval "$(/root/.local/bin/mise activate bash)"
            make build-frontend
