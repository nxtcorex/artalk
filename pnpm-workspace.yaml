packages:
  - "ui/*"
  - "docs/*"
  - "test/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

overrides:
  eslint-plugin-import>eslint: "10"
  eslint-plugin-react>eslint: "10"
  fast-uri@3: 3.1.9
  brace-expansion@5: 5.0.12
  # Newer Nolebase UI releases require VitePress 2, which is still in alpha.
  "@nolebase/vitepress-plugin-git-changelog>@nolebase/ui": 2.18.2
