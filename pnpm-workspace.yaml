packages:
  - "ui/*"
  - "docs/*"
  - "test/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

overrides:
  eslint-plugin-import>eslint: "10"
  eslint-plugin-react>eslint: "10"
  fast-uri: 3.1.1
  brace-expansion@5: 5.0.6
